<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Replicko - Products</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SH978KGH4N"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SH978KGH4N');
  </script>
  <link rel="stylesheet" href="../css/style.css?v=3">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0; padding: 0;
      background: #0A192F;
    }
    header {
      background: #0A192F;
      color: #FFD700;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }
    .search-bar {
      padding: 10px;
      text-align: center;
      background: #1E1E1E;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .search-bar input {
      width: 90%;
      padding: 8px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    /* Mobile: 2 products per row */
    .container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      padding: 20px;
    }
    /* Tablet and larger: auto-fill */
    @media (min-width: 600px) {
      .container {
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      }
    }
    .card {
      background: #1E1E1E;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card img, .card video {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
    }
    .card h3 {
      margin: 10px 0;
      font-size: 16px;
      min-height: 38px;
      color: #fff;
    }
    .card p {
      color: green;
      font-size: 13px;
      min-height: 35px;
    }
    .price {
      font-size: 15px;
      font-weight: bold;
      color: #FFD700;
      margin: 8px 0;
    }
    .btn {
      display: inline-block;
      padding: 6px 10px;
      margin: 5px 3px;
      font-size: 13px;
      border-radius: 4px;
      text-decoration: none;
      color: white;
    }
    .buy-btn { background: green; }
    .enquiry-btn { background: navy; }

    /* Fullscreen image overlay */
    .img-overlay {
      display: none;
      position: fixed;
      z-index: 9999;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
    }
    .img-overlay img {
      max-width: 95%;
      max-height: 95%;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<header>All Products</header>

<div class="search-bar">
  <input type="text" id="search-input" placeholder="Search products..." onkeyup="filterBySearch()">
</div>

<div class="container" id="product-list"></div>

<!-- Fullscreen image popup -->
<div class="img-overlay" id="imgOverlay" onclick="closeImage()">
  <img id="overlayImg" src="" alt="Preview">
</div>

<script>
  let allProducts = [];

  async function fetchProducts() {
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const category = urlParams.get('category');
      const subcategory = urlParams.get('subcategory');

      const res = await fetch("https://replicko-backend.onrender.com/api/products");
      const products = await res.json();

      allProducts = products.filter(p => 
        (!category || p.category?.toLowerCase() === category.toLowerCase()) &&
        (!subcategory || p.subcategory?.toLowerCase() === subcategory.toLowerCase())
      );

      displayProducts(allProducts);
    } catch (error) {
      console.error("Error loading products:", error);
    }
  }

  function displayProducts(productArray) {
    const productList = document.getElementById("product-list");
    productList.innerHTML = "";

    productArray.forEach(product => {
      const mediaUrl = product.image?.startsWith("http")
        ? product.image
        : `https://replicko-backend.onrender.com/${product.image}`;

      let mediaTag;
      if (/\.(mp4|webm|ogg)$/i.test(mediaUrl)) {
        mediaTag = `<video controls>
                      <source src="${mediaUrl}" type="video/mp4">
                      Your browser does not support the video tag.
                    </video>`;
      } else {
        mediaTag = `<img src="${mediaUrl}" alt="${product.title || product.name || "Product"}" onclick="openImage('${mediaUrl}')">`;
      }

      // ✅ Include product image URL in WhatsApp message
      const buyMsg = encodeURIComponent(
        `Hello, I want to buy:\n${product.title || product.name}\nPrice: ₹${product.price}\nImage: ${mediaUrl}`
      );
      const enquiryMsg = encodeURIComponent(
        `Hello, I have a query about:\n${product.title || product.name}\nPrice: ₹${product.price}\nImage: ${mediaUrl}`
      );

      const card = document.createElement("div");
      card.classList.add("card");
      card.innerHTML = `
        ${mediaTag}
        <h3>${product.title || product.name || "No Name"}</h3>
        <p>${product.description || ""}</p>
        <div class="price">₹${product.price || ""}</div>
        <a href="https://wa.me/917738625039?text=${buyMsg}" class="btn buy-btn" target="_blank">To Buy</a>
        <a href="https://wa.me/919920274474?text=${enquiryMsg}" class="btn enquiry-btn" target="_blank">For Enquiry</a>
      `;
      productList.appendChild(card);
    });
  }

  function filterBySearch() {
    const query = document.getElementById("search-input").value.toLowerCase();
    const filtered = allProducts.filter(product =>
      (product.title || product.name || "").toLowerCase().includes(query) ||
      (product.description || "").toLowerCase().includes(query)
    );
    displayProducts(filtered);
  }

  function openImage(src) {
    document.getElementById("overlayImg").src = src;
    document.getElementById("imgOverlay").style.display = "flex";
  }

  function closeImage() {
    document.getElementById("imgOverlay").style.display = "none";
  }

  fetchProducts();
</script>

</body>
</html>
