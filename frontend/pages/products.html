<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Replicko - Our Products</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f8f8f8; }
    header { padding: 15px; background: #000; color: white; text-align: center; }
    .search-bar {
      max-width: 400px; margin: 15px auto; display: flex;
      border: 1px solid #ccc; border-radius: 5px; overflow: hidden;
    }
    .search-bar input {
      flex: 1; padding: 8px; border: none; outline: none;
    }
    .search-bar button {
      background: #000; color: white; padding: 8px 12px; border: none; cursor: pointer;
    }
    .products-container {
      display: grid; gap: 15px; padding: 15px;
      grid-template-columns: repeat(2, 1fr);
    }
    @media (min-width: 600px) {
      .products-container { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
    }
    .product-card {
      border: 1px solid #ddd; border-radius: 8px; padding: 10px; text-align: center; background: #fff;
      display: flex; flex-direction: column; justify-content: space-between;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .product-card img {
      width: 100%; height: 180px; object-fit: cover; border-radius: 8px;
    }
    .product-title { font-weight: bold; margin: 8px 0; font-size: 16px; }
    .product-desc { font-size: 13px; color: #555; margin-bottom: 5px; min-height: 30px; }
    .product-price { font-size: 15px; font-weight: bold; margin-bottom: 10px; color: #222; }
    .btn {
      display: inline-block; padding: 6px 10px; font-size: 14px; border-radius: 5px;
      margin: 3px; text-decoration: none; color: white;
    }
    .btn-enquiry { background-color: #25D366; }
    .btn-buy { background-color: #007bff; }
  </style>
</head>
<body>

  <header>
    <h1>Our Products</h1>
  </header>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search products...">
    <button onclick="filterProducts()">Search</button>
  </div>

  <div id="productsContainer" class="products-container">
    <p>Loading products...</p>
  </div>

  <script>
    let allProducts = [];

    async function fetchProducts() {
      try {
        const res = await fetch('https://replicko-backend.onrender.com/api/products');
        const products = await res.json();
        allProducts = products;
        displayProducts(products);
      } catch (error) {
        document.getElementById('productsContainer').innerHTML = '<p>Error loading products.</p>';
      }
    }

    function getImageUrl(product) {
      if (!product.image) return 'https://via.placeholder.com/300x180?text=No+Image';
      if (product.image.startsWith('http')) return product.image;
      return `https://replicko-backend.onrender.com${product.image}`;
    }

    function displayProducts(products) {
      const container = document.getElementById('productsContainer');
      if (!products.length) {
        container.innerHTML = '<p>No products found.</p>';
        return;
      }

      container.innerHTML = products.map(product => `
        <div class="product-card">
          <img src="${getImageUrl(product)}" alt="${product.title}">
          <div class="product-title">${product.title}</div>
          <div class="product-desc">${product.description || ''}</div>
          <div class="product-price">₹${product.price}</div>
          <a href="https://wa.me/919920274474?text=${encodeURIComponent('Enquiry about ' + product.title)}" class="btn btn-enquiry">For Enquiry</a>
          <a href="https://wa.me/917738625039?text=${encodeURIComponent('Buy ' + product.title)}" class="btn btn-buy">To Buy</a>
        </div>
      `).join('');
    }

    function filterProducts() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allProducts.filter(p =>
        p.title.toLowerCase().includes(searchTerm) ||
        (p.description && p.description.toLowerCase().includes(searchTerm))
      );
      displayProducts(filtered);
    }

    fetchProducts();
  </script>

</body>
</html>
