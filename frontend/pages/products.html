<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Replicko - Products</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f8f8f8; }
    header { background: black; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
    .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; padding: 20px; }
    .card { background: white; border-radius: 8px; padding: 15px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .card img { width: 100%; height: 250px; object-fit: cover; border-radius: 8px; }
    .card h3 { margin: 10px 0; font-size: 18px; }
    .card p { color: #555; font-size: 14px; }
    .price { font-size: 16px; font-weight: bold; color: green; margin: 5px 0; }
    .btn { display: inline-block; padding: 8px 12px; margin: 5px 3px; font-size: 14px; border-radius: 4px; text-decoration: none; color: white; }
    .buy-btn { background: green; }
    .enquiry-btn { background: blue; }
  </style>
</head>
<body>

<header>All Products</header>
<div class="container" id="product-list"></div>

<script>
  async function fetchProducts() {
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const category = urlParams.get('category');
      const subcategory = urlParams.get('subcategory');

      const res = await fetch("https://replicko-backend.onrender.com/api/products");
      const products = await res.json();

      const filtered = products.filter(p => 
        (!category || p.category?.toLowerCase() === category.toLowerCase()) &&
        (!subcategory || p.subcategory?.toLowerCase() === subcategory.toLowerCase())
      );

      const productList = document.getElementById("product-list");
      productList.innerHTML = "";

      filtered.forEach(product => {
        const buyMsg = encodeURIComponent(`Hello, I want to buy: ${product.name} - Price: ₹${product.price}`);
        const enquiryMsg = encodeURIComponent(`Hello, I have a query about: ${product.name}`);

        const card = document.createElement("div");
        card.classList.add("card");
        card.innerHTML = `
          <img src="https://replicko-backend.onrender.com/${product.image}" alt="${product.name}">
          <h3>${product.name}</h3>
          <p>${product.description}</p>
          <div class="price">₹${product.price}</div>
          <a href="https://wa.me/917738625039?text=${buyMsg}" class="btn buy-btn" target="_blank">To Buy</a>
          <a href="https://wa.me/919920274474?text=${enquiryMsg}" class="btn enquiry-btn" target="_blank">For Enquiry</a>
        `;
        productList.appendChild(card);
      });
    } catch (error) {
      console.error("Error loading products:", error);
    }
  }

  fetchProducts();
</script>

</body>
</html>
