<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replicko - Products</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #111;
            color: white;
        }
        .container {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: #1b1b1b;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s ease;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-card img {
            max-width: 100%;
            max-height: 220px;
            object-fit: contain;
            border-radius: 8px;
            background: white;
        }
        .product-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 10px;
        }
        .product-price {
            color: #00ff88;
            font-size: 1rem;
            margin: 8px 0;
        }
        .whatsapp-btn {
            display: inline-block;
            padding: 8px 12px;
            background-color: #25D366;
            color: white;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }
        .whatsapp-btn:hover {
            background-color: #1ebe5d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Our Products</h1>
        <div class="products-grid" id="products-container">
            <p>Loading products...</p>
        </div>
    </div>

    <script>
        const API_URL = "https://replicko-backend.onrender.com/api/products/all";
        const productsContainer = document.getElementById("products-container");

        async function fetchProducts() {
            try {
                const res = await fetch(API_URL);
                const products = await res.json();

                if (!products || products.length === 0) {
                    productsContainer.innerHTML = "<p>No products found.</p>";
                    return;
                }

                renderProducts(products);
            } catch (err) {
                console.error("Error fetching products:", err);
                productsContainer.innerHTML = "<p>Failed to load products.</p>";
            }
        }

        function renderProducts(products) {
            productsContainer.innerHTML = products.map(p => {
                // Ensure image is handled correctly even if URL has query params
                let imgURL = p.image ? p.image.trim() : "";
                let fileExt = imgURL.split("?")[0].split(".").pop().toLowerCase();

                // Allow only valid image formats
                const validExts = ["jpg", "jpeg", "png", "webp", "gif"];
                if (!validExts.includes(fileExt)) {
                    console.warn(`Invalid or missing image format for: ${p.title}`);
                    imgURL = "https://via.placeholder.com/250?text=No+Image";
                }

                // WhatsApp link
                const message = encodeURIComponent(`Hello, I am interested in the product: ${p.title} - Price: ₹${p.price}`);
                const whatsappLink = `https://wa.me/918866571157?text=${message}`;

                return `
                    <div class="product-card">
                        <img src="${imgURL}" alt="${p.title}" onerror="this.src='https://via.placeholder.com/250?text=Image+Not+Found'">
                        <div class="product-title">${p.title || "No Title"}</div>
                        <div class="product-price">₹${p.price || "N/A"}</div>
                        <a class="whatsapp-btn" href="${whatsappLink}" target="_blank">Enquire on WhatsApp</a>
                    </div>
                `;
            }).join("");
        }

        fetchProducts();
    </script>
</body>
</html>
