<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replicko - Products</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f8f8;
            margin: 0;
            padding: 0;
        }
        header {
            background: black;
            padding: 15px;
            text-align: center;
            color: white;
        }
        h1 {
            margin: 0;
            font-size: 22px;
        }
        .search-container {
            text-align: center;
            padding: 10px;
        }
        .search-container input {
            width: 90%;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .products-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            padding: 15px;
        }
        .product-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            text-align: center;
        }
        .product-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        .product-info {
            padding: 10px;
        }
        .product-info h3 {
            margin: 5px 0;
            font-size: 16px;
            color: #333;
        }
        .product-info p {
            font-size: 14px;
            color: #666;
            min-height: 35px;
        }
        .product-price {
            font-weight: bold;
            color: green;
            margin: 5px 0;
        }
        .btn-container {
            display: flex;
            gap: 5px;
            justify-content: center;
            margin-bottom: 10px;
        }
        .btn-container a {
            flex: 1;
            padding: 6px;
            font-size: 14px;
            text-decoration: none;
            background: black;
            color: white;
            border-radius: 4px;
        }
        .btn-container a.buy-btn {
            background: green;
        }
    </style>
</head>
<body>

<header>
    <h1>Our Products</h1>
</header>

<div class="search-container">
    <input type="text" id="searchInput" placeholder="Search products...">
</div>

<div class="products-container" id="productsContainer">
    <!-- Products will be loaded here -->
</div>

<script>
    const API_URL = "https://replicko-backend.onrender.com/api/products";
    const productsContainer = document.getElementById("productsContainer");
    const searchInput = document.getElementById("searchInput");

    async function fetchProducts() {
        try {
            const res = await fetch(API_URL);
            const products = await res.json();
            displayProducts(products);

            searchInput.addEventListener("input", () => {
                const searchValue = searchInput.value.toLowerCase();
                const filtered = products.filter(p =>
                    p.title.toLowerCase().includes(searchValue) ||
                    p.description.toLowerCase().includes(searchValue)
                );
                displayProducts(filtered);
            });
        } catch (error) {
            console.error("Error fetching products:", error);
            productsContainer.innerHTML = "<p>Failed to load products.</p>";
        }
    }

    function displayProducts(products) {
        productsContainer.innerHTML = "";
        if (products.length === 0) {
            productsContainer.innerHTML = "<p>No products found.</p>";
            return;
        }

        products.forEach(product => {
            const card = document.createElement("div");
            card.classList.add("product-card");

            card.innerHTML = `
                <img src="${product.image}" alt="${product.title}">
                <div class="product-info">
                    <h3>${product.title}</h3>
                    <p>${product.description}</p>
                    <div class="product-price">₹${product.price}</div>
                </div>
                <div class="btn-container">
                    <a href="https://wa.me/919920274474?text=Hi, I want to enquire about ${encodeURIComponent(product.title)}" target="_blank">For Enquiry</a>
                    <a href="https://wa.me/917738625039?text=Hi, I want to buy ${encodeURIComponent(product.title)}" target="_blank" class="buy-btn">To Buy</a>
                </div>
            `;
            productsContainer.appendChild(card);
        });
    }

    fetchProducts();
</script>

</body>
</html>
