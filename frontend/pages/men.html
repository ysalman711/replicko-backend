<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Replicko - Men Collection</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgb(13, 199, 212);
      color: black;
      padding: 15px 20px;
      position: relative;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 15px;
    }

    .nav-links li {
      display: inline-block;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-weight: 500;
    }

    /* Hamburger */
    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 4px;
    }

    .hamburger span {
      width: 25px;
      height: 3px;
      background: black;
    }

    /* Mobile Menu */
    @media (max-width: 768px) {
      .nav-links {
        display: none;
        flex-direction: column;
        position: absolute;
        top: 60px;
        left: 0;
        width: 100%;
        background: rgb(13, 199, 212);
        padding: 15px 0;
      }

      .nav-links.active {
        display: flex;
      }

      .hamburger {
        display: flex;
      }
    }

    .banner {
      background: linear-gradient(to right, #000000, #222222);
      color: rgb(13, 199, 212);
      text-align: center;
      padding: 40px 20px 20px;
    }

    .banner h1 {
      margin: 0;
      font-size: 28px;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 30px;
      justify-items: center;
    }

    .category-card {
      background: #000;
      color: #0ff;
      border-radius: 12px;
      padding: 15px 10px;
      text-align: center;
      transition: transform 0.3s ease;
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 260px;
    }

    .category-card img {
      width: 100%;
      max-width: 220px;
      height: 160px;
      object-fit: cover;
      margin-bottom: 12px;
      border-radius: 8px;
      background: #fff;
    }

    .category-card:hover {
      transform: translateY(-5px);
      background: #111;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: black;
      color: rgb(13, 199, 212);
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">Replicko</div>
    <ul class="nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="../index.html#about">About</a></li>
      <li><a href="../index.html#contact">Contact</a></li>
    </ul>
    <div class="hamburger" onclick="toggleMenu()">
      <span></span><span></span><span></span>
    </div>
  </nav>

  <!-- Banner -->
  <header class="banner">
    <h1>Men's Brand Categories</h1>
  </header>

  <!-- Category Grid with Images -->
  <section class="category-grid">
    <a class="category-card" href="./products.html?category=Men&subcategory=Watches">
      <img src="../images/categories/watch.jpg" alt="Watches" />
      Watches
    </a>
    <a class="category-card" href="./products.html?category=Men&subcategory=Glares">
      <img src="../images/categories/glares.jpg" alt="Glares" />
      Glares
    </a>
    <a class="category-card" href="./products.html?category=Men&subcategory=Perfumes">
      <img src="../images/categories/perfume.jpg" alt="Perfumes" />
      Perfumes
    </a>
    <a class="category-card" href="./products.html?category=Men&subcategory=Electronics">
      <img src="../images/categories/electronics.jpg" alt="Electronics" />
      Electronics
    </a>
    <a class="category-card" href="./products.html?category=Men&subcategory=Combos">
      <img src="../images/categories/combo.jpg" alt="Combos" />
      Combos
    </a>
    <a class="category-card" href="./products.html?category=Men&subcategory=Others">
      <img src="../images/categories/others.jpg" alt="Others" />
      Others
    </a>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Replicko. All rights reserved.</p>
  </footer>

  <script>
    function toggleMenu() {
      document.querySelector('.nav-links').classList.toggle('active');
    }
  </script>
</body>
</html>
